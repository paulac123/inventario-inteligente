services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend/dist:/frontend/dist
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:${DB_PASSWORD}@db:5432/bd_inventario
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: inventario_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bd_inventario
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
